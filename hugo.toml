baseURL = 'https://masanorihigashihara.github.io/Classic-Mathematics-Papers/'
languageCode = 'ja'
title = 'Classic Mathematics Papers'
theme = "hugo-book"

enableRobotsTXT = true
buildDrafts = false
buildFuture = false
buildExpired = false

[params]
  # hugo-book theme configuration
  BookSection = 'papers'
  BookToC = true
  BookSearch = true
  
  # MathJax support
  math = true
  
  # Cloudflare R2 PDF storage
  # Set this to your R2 public URL (e.g., "https://pub-xxxxx.r2.dev" or custom domain)
  # Leave empty to use local static files
  pdfBaseURL = "https://pub-b7de6127921a4952aac9bd48e1710bcb.r2.dev"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    noClasses = false

